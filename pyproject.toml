[project]
name = "sqs"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Czuba", email = "michal.czuba.1995@gmail.com" },
    { name = "Mateusz Stolarski", email="mateusz.stolarski@pwr.edu.pl" },
    { name = "Mingshan Jia", email="Mingshan.Jia@uts.edu.au" },
    { name = "Piotr Bródka", email="piotr.brodka@pwr.edu.pl" },
]
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.50",
    "hydra-core>=1.4.0.dev1",
    "network-diffusion==0.19.1",
    "networkx>=3.6.1",
    "pandas>=2.2.3",
    "pyyaml>=6.0.3",
    "psutil>=6.0.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.6",
    "torch>=2.2.0",
    "torch-geometric>=2.8.0",
    "bidict>=0.23.1",
    "scipy>=1.11",
    "dvc~=3.66.1",
    "dvc-gdrive~=3.0.1",
]

[project.scripts]
sqs = "sqs.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[tool.uv]
prerelease = "allow"
