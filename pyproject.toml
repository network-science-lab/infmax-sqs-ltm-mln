[project]
name = "sqs"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Czuba", email = "michal.czuba.1995@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.50",
    "network-diffusion==0.19.1",
    "networkx>=3.6.1",
    "pandas>=2.2.3",
    "pyyaml>=6.0.3",
    "tqdm>=4.66.6",
]

[project.scripts]
sqs = "sqs.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[tool.uv]
prerelease = "allow"
