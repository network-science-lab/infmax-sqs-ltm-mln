defaults:
  - override hydra/job_logging: custom
  - _self_

networks:
  - "toy_network_piotr"
  - "toy_network_cim"

run:
  experiment_type: "spreading"
  out_dir: "./examples/spreading"

spreading:
  protocols:
    - "OR"
  mi_values:
    - 0.15
  seed_budgets:
    - 0.10
    - 0.20
  repetitions: 3

  seeding_schedule:
    class: "MockSeedingStrategy"
    max_epochs: 100 # hard upper bound on total simulation epochs
    patience: 5 # stop once all seeds planted and this many no-change LTM epochs pass
    params: {} # class-specific constructor kwargs

hydra:
  run:
    dir: ${run.out_dir}
