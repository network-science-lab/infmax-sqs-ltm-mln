defaults:
  - override hydra/job_logging: custom
  - _self_

networks:
  - "toy_network_piotr"

run:
  experiment_type: "spreading"
  out_dir: "./examples/static_strategy"

spreading:
  protocols:
    - "OR"
    - "AND"
  mi_values:
    - 0.3
  seed_budgets:
    - 0.20
  repetitions: 2
  max_epochs: 50
  # patience: consecutive LTM epochs with no new activations before stopping (or before an
  # SQ_R revival seed).  Higher values extend run time: SQ_R needs ~n_seeds*(patience+2)
  # total epochs, so keep max_epochs >= that bound.  SS and SQ modes are unaffected.
  patience: 1

  detailed_logs:
    save: true
    zip: false

seeding_schedules:
  - name: "static_ss_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SS"
  - name: "static_ss_deg_c_d"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SS"
  - name: "static_ss_nghb_s"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SS"
  - name: "static_ss_nghb_sd"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SS"
  - name: "static_ss_random"
    class: "StaticSeedingStrategy"
    params:
      selector: "random"
      mode: "SS"
  - name: "static_ss_voterank"
    class: "StaticSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SS"
      selector_params:
        device: "cpu"
  - name: "static_ss_mds"
    class: "StaticSeedingStrategy"
    params:
      selector: "mds"
      mode: "SS"
  - name: "static_sq_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_deg_c_d"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_nghb_s"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_nghb_sd"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_random"
    class: "StaticSeedingStrategy"
    params:
      selector: "random"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_voterank"
    class: "StaticSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SQ"
      batch_size: 1
      selector_params:
        device: "cpu"
  - name: "static_sq_mds"
    class: "StaticSeedingStrategy"
    params:
      selector: "mds"
      mode: "SQ"
      batch_size: 1
  - name: "static_sq_r_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ_R"
      batch_size: 1
  - name: "static_sq_r_deg_c_d"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SQ_R"
      batch_size: 1
  - name: "static_sq_r_nghb_s"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SQ_R"
      batch_size: 1
  - name: "static_sq_r_nghb_sd"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SQ_R"
      batch_size: 1
  - name: "static_sq_r_random"
    class: "StaticSeedingStrategy"
    params:
      selector: "random"
      mode: "SQ_R"
      batch_size: 1
  - name: "static_sq_r_voterank"
    class: "StaticSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SQ_R"
      batch_size: 1
      selector_params:
        device: "cpu"
  - name: "static_sq_r_mds"
    class: "StaticSeedingStrategy"
    params:
      selector: "mds"
      mode: "SQ_R"
      batch_size: 1
hydra:
  run:
    dir: ${run.out_dir}
