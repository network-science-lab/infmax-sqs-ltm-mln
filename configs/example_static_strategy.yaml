defaults:
  - override hydra/job_logging: custom
  - _self_

networks:
  - "toy_network_piotr"

run:
  experiment_type: "spreading"
  out_dir: "./examples/static_strategy"

spreading:
  protocols:
    - "OR"
    - "AND"
  mi_values:
    - 0.3
  seed_budgets:
    - 0.20
  repetitions: 2
  max_epochs: 50
  patience: 1

  detailed_logs:
    save: true
    zip: false

seeding_schedules:
  - name: "ss_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SS"
  - name: "ss_deg_c_d"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SS"
  - name: "ss_nghb_s"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SS"
  - name: "ss_nghb_sd"
    class: "StaticSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SS"
  - name: "ss_random"
    class: "StaticSeedingStrategy"
    params:
      selector: "random"
      mode: "SS"
  - name: "ss_voterank"
    class: "StaticSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SS"
  - name: "ss_pagerank"
    class: "StaticSeedingStrategy"
    params:
      selector: "pagerank"
      mode: "SS"
  - name: "sq_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ"
      batch_size: 1
  - name: "sq_r_deg_c"
    class: "StaticSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ_R"
      batch_size: 1
  - name: "ss_ts_net"
    class: "StaticSeedingStrategy"
    params:
      selector: "ts-net"
      mode: "SS"
      selector_params:
        model_dir: "/Users/mateuszstolarski/repos/infmax-trainer-icm-mln/model/IN-832"
        device: "cpu"

hydra:
  run:
    dir: ${run.out_dir}
