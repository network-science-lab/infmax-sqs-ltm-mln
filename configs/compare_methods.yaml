# Config for scripts/compare_methods.py
# Usage: uv run python scripts/compare_methods.py --config configs/compare_methods.yaml

# results.csv path or glob; matching files are concatenated. Jobs of the Static grid
# (data/static_results/<source>/<job>/), without _chunks slices or merged full_<network> files.
results_csv: "./data/static_results/*/*/results.csv"

out_dir: "./data/processed/stats"

# Metrics to test. Available: gain, auc, auc_total, saved_seeds, simulation_length.
metrics:
  - gain
  - auc
  - saved_seeds

# Tests run independently within each group (one test per group, metric and pair of methods).
group_by:
  - protocol
  - network

# Paired observations within a group: cells (metric averaged over repetitions first).
pair_by:
  - mi_value
  - seed_budget

# Comparison mode:
#   all_pairs   — every pairwise combination of ss_method values
#   vs_baseline — each method vs the single baseline named below
comparisons:
  mode: "all_pairs"
  baseline: "ss_deg_c_d" # used only when mode=vs_baseline

# Significance threshold (applied to BH-adjusted p-values).
alpha: 0.05

# Wilcoxon alternative hypothesis: two-sided | greater | less.
alternative: "two-sided"
