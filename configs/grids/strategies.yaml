# Static configs from sources re-run with other strategies (see scripts/run_grid.py).

# source name -> glob over config names (multi-schedule configs are split per schedule)
sources:
  full: full/*
  arxiv: arxiv/*
  timik: timik/*
  aucs: full_experiment_*_aucs

# Adaptive: base version (the push-score version is parked in git stash, "adaptive push score")
strategies:
  SubnetSeedingStrategy:
    prefix: subnet
    results_root: data/_subnet_results
  AdaptiveSeedingStrategy:
    prefix: adaptive
    results_root: data/_adaptive_results

# Selectors (of the Static ones) run here. Excluded:
# - mds+deg: Subnet recomputes the minimum dominating set at every seed (0.3 s per actor timeout,
#   e.g. ~4 h per rep on er2, ~24 h on arxiv), impractical.
# - voterank: Subnet uses only the first candidate of each re-ranking; first-round votes are one
#   per neighbour, so it picks (almost always) the same actor as nghb-sd: duplicate results. Note
#   that deg-c-d and nghb-sd themselves reduce to plain degree / neighbourhood size in Subnet
#   (discounting only affects later picks).
# In Adaptive the selector only picks the first seed (fallback without a frontier).
selectors:
  - deg-c-d
  - nghb-sd
  - ts-net

# SS skipped (for Subnet equivalent to Static SS)
modes:
  - SQ
  - SQ_R

mi_values:
  OR:
    - 0.7
    - 0.8
    - 0.9
  AND:
    - 0.5
    - 0.6
    - 0.7

seed_budgets:
  OR:
    - 0.1
    - 0.15
    - 0.2
    - 0.25
  AND:
    - 0.2
    - 0.25
    - 0.3
    - 0.35

exclude:
  timik:
    modes:
      - SQ_R
