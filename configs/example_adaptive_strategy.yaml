defaults:
  - override hydra/job_logging: custom
  - _self_

networks:
  - "toy_network_piotr"

run:
  experiment_type: "spreading"
  out_dir: "./examples/adaptive_strategy"

spreading:
  protocols:
    - "OR"
    - "AND"
  mi_values:
    - 0.3
  seed_budgets:
    - 0.20
  repetitions: 2
  max_epochs: 50
  # patience: consecutive LTM epochs with no new activations before stopping (or before an
  # SQ_R revival seed).  Higher values extend run time: SQ_R needs ~n_seeds*(patience+2)
  # total epochs, so keep max_epochs >= that bound.  SS and SQ modes are unaffected.
  patience: 1

  detailed_logs:
    save: true
    zip: false

# AdaptiveSeedingStrategy seeds actors on the activation frontier (neighbours of
# currently active nodes), ranked by activation potential (active_neighbours /
# total_degree).  When no active nodes exist yet it falls back to selector-based
# ranking on the inactive subnet -- identical to SubnetSeedingStrategy.
seeding_schedules:
  - name: "adaptive_ss_deg_c"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SS"
  - name: "adaptive_ss_deg_c_d"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SS"
  - name: "adaptive_ss_nghb_s"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SS"
  - name: "adaptive_ss_nghb_sd"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SS"
  - name: "adaptive_ss_random"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "random"
      mode: "SS"
  - name: "adaptive_ss_voterank"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SS"
  - name: "adaptive_ss_mds"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "mds"
      mode: "SS"
  - name: "adaptive_ss_ts_net"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "ts-net"
      mode: "SS"
      selector_params:
        model_dir: "/Users/mateuszstolarski/repos/infmax-trainer-icm-mln/model/IN-832"
        device: "cpu"

  - name: "adaptive_sq_deg_c"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_deg_c_d"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_nghb_s"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_nghb_sd"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_random"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "random"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_voterank"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_mds"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "mds"
      mode: "SQ"
      batch_size: 1
  - name: "adaptive_sq_ts_net"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "ts-net"
      mode: "SQ"
      batch_size: 1
      selector_params:
        model_dir: "/Users/mateuszstolarski/repos/infmax-trainer-icm-mln/model/IN-832"
        device: "cpu"

  - name: "adaptive_sq_r_deg_c"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_deg_c_d"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "deg-c-d"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_nghb_s"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-s"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_nghb_sd"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "nghb-sd"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_random"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "random"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_voterank"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "voterank"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_mds"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "mds"
      mode: "SQ_R"
      batch_size: 1
  - name: "adaptive_sq_r_ts_net"
    class: "AdaptiveSeedingStrategy"
    params:
      selector: "ts-net"
      mode: "SQ_R"
      batch_size: 1
      selector_params:
        model_dir: "/Users/mateuszstolarski/repos/infmax-trainer-icm-mln/model/IN-832"
        device: "cpu"

hydra:
  run:
    dir: ${run.out_dir}
